<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lalla pastilla</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="index.html">
            <img src="assets/patisserie-logo.avif" alt="logo" width="50" height="50">
            <span><em>Lalla Pastilla</em></span>
        </a>

        <nav>
            <ul class="menu">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="special.html">Spécialités</a></li>
                <li><a href="contact.html">Contact</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <section class="contact">
          <h2>Contactez-nous</h2>
        </section>
        <form action="#">

            <label for="nom">Nom</label>
            <input type="text" id="nom" required>

            <label for="email">E-mail</label>
            <input type="text" id="email" required>

            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" required>

            <label for="message">Message</label>
            <textarea name="message" id="message" rows="6" required></textarea>

            <button type="submit" class="bouton">Envoyer</button>
        </form>
       
    </main>
    
</body>
<footer class="footer">
    <div class="sub-footer">
        <h3>Horaires d'ouverture</h3>
        <p>Lundi - Samedi : 8h - 20h</p>
        <p>Dimanche : 9h - 12h30</p>
    </div>


</footer>
</html>
